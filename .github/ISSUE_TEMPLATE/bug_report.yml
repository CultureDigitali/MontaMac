name: Bug report
description: Report a reproducible problem in MontaMac
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve MontaMac. Remove passwords, tokens, private hosts, usernames and personal paths before submitting.
  - type: input
    id: version
    attributes:
      label: MontaMac version
      placeholder: "2.1.0 (build 4)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.x"
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Protocol
      options:
        - SFTP
        - WebDAV HTTPS
        - FTP
        - Application or installer
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Create a profile using host.example.com
        2. Select Mount
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted diagnostics
      description: Paste only the minimum relevant output after removing credentials, private hosts, usernames and personal paths.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, tokens, private server information and personal paths.
          required: true
        - label: I searched existing issues for this problem.
          required: true
