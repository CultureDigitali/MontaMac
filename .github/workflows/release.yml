name: Signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
      SPARKLE_FEED_URL: https://github.com/CultureDigitali/MontaMac/releases/latest/download/appcast.xml
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify tag and test
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "v$VERSION" = "$GITHUB_REF_NAME"
          swift test

      - name: Import Developer ID certificates
        env:
          APP_P12: ${{ secrets.APPLE_APPLICATION_P12_BASE64 }}
          APP_P12_PASSWORD: ${{ secrets.APPLE_APPLICATION_P12_PASSWORD }}
          INSTALLER_P12: ${{ secrets.APPLE_INSTALLER_P12_BASE64 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/montamac-release.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          test -n "$APP_P12" && test -n "$INSTALLER_P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APP_P12" | base64 --decode > "$RUNNER_TEMP/application.p12"
          echo "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/application.p12" -k "$KEYCHAIN_PATH" -P "$APP_P12_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN_PATH" -P "$INSTALLER_P12_PASSWORD" -T /usr/bin/pkgbuild
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build signed app and package
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: |
          APP_ID=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application/{print $2; exit}')
          INSTALLER_ID=$(security find-certificate -a -c "Developer ID Installer" -Z "$KEYCHAIN_PATH" | awk '/SHA-1/{print $3; exit}')
          test -n "$APP_ID" && test -n "$INSTALLER_ID" && test -n "$SPARKLE_PUBLIC_KEY"
          MONTAMAC_RELEASE_BUILD=1 \
          MONTAMAC_SIGN_IDENTITY="$APP_ID" \
          MONTAMAC_INSTALLER_IDENTITY="$INSTALLER_ID" \
          MONTAMAC_SPARKLE_FEED_URL="$SPARKLE_FEED_URL" \
          MONTAMAC_SPARKLE_PUBLIC_KEY="$SPARKLE_PUBLIC_KEY" \
          zsh Scripts/build-pkg.sh
          test "$(uname -m)" = arm64
          /usr/bin/lipo -archs MontaMac.app/Contents/MacOS/MontaMac | grep -qw arm64
          codesign --verify --deep --strict --verbose=2 MontaMac.app
          pkgutil --check-signature "dist/MontaMac-${GITHUB_REF_NAME#v}.pkg"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ditto -c -k --keepParent MontaMac.app "$RUNNER_TEMP/MontaMac-$VERSION.zip"
          xcrun notarytool submit "$RUNNER_TEMP/MontaMac-$VERSION.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --wait
          xcrun stapler staple MontaMac.app
          xcrun notarytool submit "dist/MontaMac-$VERSION.pkg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --wait
          xcrun stapler staple "dist/MontaMac-$VERSION.pkg"
          ditto -c -k --keepParent MontaMac.app "dist/MontaMac-$VERSION.zip"
          spctl --assess --type execute --verbose=2 MontaMac.app
          spctl --assess --type install --verbose=2 "dist/MontaMac-$VERSION.pkg"

      - name: Sign Sparkle archive and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-private-key"
          chmod 600 "$RUNNER_TEMP/sparkle-private-key"
          .build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file "$RUNNER_TEMP/sparkle-private-key" "dist/MontaMac-$VERSION.zip"
          .build/artifacts/sparkle/Sparkle/bin/generate_appcast --ed-key-file "$RUNNER_TEMP/sparkle-private-key" --download-url-prefix "https://github.com/CultureDigitali/MontaMac/releases/download/$GITHUB_REF_NAME/" dist
          (cd dist && shasum -a 256 "MontaMac-$VERSION.pkg" > "MontaMac-$VERSION.pkg.sha256")
          (cd dist && shasum -a 256 "MontaMac-$VERSION.zip" > "MontaMac-$VERSION.zip.sha256")

      - name: Verify Sparkle signature against the shipped app
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          swift Scripts/verify-sparkle-release.swift MontaMac.app "dist/MontaMac-$VERSION.zip" dist/appcast.xml

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" \
            "dist/MontaMac-$VERSION.pkg" \
            "dist/MontaMac-$VERSION.pkg.sha256" \
            "dist/MontaMac-$VERSION.zip" \
            "dist/MontaMac-$VERSION.zip.sha256" \
            "dist/appcast.xml" \
            --verify-tag --title "MontaMac $VERSION" --generate-notes
